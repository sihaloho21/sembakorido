<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Structured Product Card</title>

  <!-- Tailwind CDN untuk prototype. Pada production, gunakan Tailwind build project existing. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              900: '#064e3b'
            }
          },
          boxShadow: {
            card: '0 4px 16px rgba(15, 23, 42, 0.07)',
            'card-hover': '0 12px 28px rgba(15, 118, 110, 0.14)'
          }
        }
      }
    };
  </script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
  <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
    <section aria-labelledby="product-grid-title">
      <div class="mb-5 flex items-end justify-between gap-4">
        <div>
          <p class="text-xs font-bold uppercase tracking-[0.18em] text-brand-600">Katalog</p>
          <h1 id="product-grid-title" class="mt-1 text-2xl font-extrabold tracking-tight text-slate-900 sm:text-3xl">
            Paket Sembako
          </h1>
        </div>
        <p class="text-sm text-slate-500">Pilihan kebutuhan harian</p>
      </div>

      <!-- Product grid: mobile 2 kolom, desktop 5 kolom -->
      <div id="product-grid" class="grid grid-cols-2 gap-3 sm:gap-4 lg:grid-cols-5 lg:gap-5" aria-live="polite">
        <!-- Contoh satu card. Pada aplikasi existing, bagian ini dirender oleh JavaScript. -->
        <article
          class="group relative flex min-h-[390px] flex-col overflow-hidden rounded-xl border border-slate-100 bg-white shadow-card transition duration-200 motion-reduce:transition-none hover:shadow-card-hover focus-within:ring-2 focus-within:ring-brand-500 focus-within:ring-offset-2 sm:min-h-[430px]"
          data-product-card
          data-product-id="beras-ramos-5kg"
        >
          <!-- Media zone -->
          <div class="relative aspect-square shrink-0 overflow-hidden bg-brand-50 p-3 sm:p-4">
            <span class="absolute left-3 top-3 z-10 rounded-md bg-brand-600 px-2 py-1 text-[10px] font-extrabold uppercase tracking-wide text-white sm:left-4 sm:top-4">
              Promo
            </span>

            <button
              type="button"
              class="absolute right-3 top-3 z-10 flex min-h-11 min-w-11 items-center justify-center rounded-full bg-white/90 text-slate-500 shadow-sm ring-1 ring-slate-200 transition hover:text-brand-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 sm:right-4 sm:top-4"
              aria-label="Tambahkan Beras Ramos 5 kg ke wishlist"
              data-action="toggle-wishlist"
              data-product-id="beras-ramos-5kg"
            >
              <span aria-hidden="true" class="text-xl leading-none">♡</span>
            </button>

            <img
              src="/assets/images/beras-ramos-5kg.webp"
              alt="Beras Ramos 5 kg"
              width="480"
              height="480"
              loading="lazy"
              decoding="async"
              class="h-full w-full object-contain object-center transition duration-200 motion-reduce:transition-none group-hover:scale-[1.03]"
              onerror="this.classList.add('hidden'); this.nextElementSibling.classList.remove('hidden');"
            />
            <div class="hidden h-full w-full items-center justify-center text-center text-sm font-semibold text-slate-400" role="img" aria-label="Gambar Beras Ramos 5 kg tidak tersedia">
              Gambar produk tidak tersedia
            </div>
          </div>

          <!-- Information + action zone -->
          <div class="flex flex-1 flex-col p-3 sm:p-4">
            <a
              href="/detail-produk.html?id=beras-ramos-5kg"
              class="rounded-md focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:ring-offset-2"
              aria-label="Lihat detail Beras Ramos 5 kg"
            >
              <h2 class="line-clamp-2 min-h-[2.75rem] text-sm font-bold leading-5 text-slate-900 sm:text-base sm:leading-6">
                Beras Ramos Premium 5 kg
              </h2>
            </a>
            <p class="mt-1 min-h-5 text-xs text-slate-500 sm:text-sm">1 paket · kualitas premium</p>

            <div class="mt-3">
              <div class="flex flex-wrap items-baseline gap-x-2 gap-y-1">
                <p class="text-base font-extrabold tracking-tight text-brand-700 sm:text-lg">Rp78.000</p>
                <p class="text-xs text-slate-400 line-through sm:text-sm">Rp85.000</p>
              </div>
              <p class="mt-1 text-xs font-medium text-brand-700">Hemat Rp7.000</p>
            </div>

            <!-- Status stok: jangan hanya mengandalkan warna -->
            <p class="mt-3 flex items-center gap-1.5 text-xs font-semibold text-amber-700" role="status">
              <span class="h-2 w-2 rounded-full bg-amber-500" aria-hidden="true"></span>
              Stok terbatas · tersisa 8
            </p>

            <!-- Action zone selalu didorong ke bawah -->
            <div class="mt-auto pt-4" data-product-cart-slot data-product-id="beras-ramos-5kg">
              <button
                type="button"
                class="flex min-h-11 w-full items-center justify-center gap-2 rounded-lg bg-brand-600 px-3 py-2.5 text-sm font-bold text-white shadow-sm transition hover:bg-brand-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:ring-offset-2 active:scale-[0.98] disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500 motion-reduce:transition-none motion-reduce:active:scale-100"
                data-action="add-to-cart"
                data-product-id="beras-ramos-5kg"
                aria-label="Tambahkan Beras Ramos 5 kg ke keranjang"
              >
                <span aria-hidden="true" class="text-lg leading-none">+</span>
                <span>Tambah</span>
              </button>
            </div>
          </div>
        </article>
      </div>
    </section>
  </main>
</body>
</html>

<!--
============================================================
INTEGRATION TEMPLATE — gunakan di renderProducts() existing
============================================================

Catatan:
1. Pertahankan data-action dan data-product-id yang sudah digunakan controller existing.
2. Ganti nama field gambar sesuai kontrak data aplikasi: p.gambar, p.image, atau p.imageUrl.
3. Gunakan escapeHtml() existing sebelum memasukkan nilai dari API ke innerHTML.
4. renderProductCardCartControl(p) tetap dipanggil pada action zone agar cart state tidak berubah.
5. Jangan membuat button interaktif berada di dalam anchor detail produk.
-->

<script>
  function renderStructuredProductCard(p) {
    const productId = String(p.id || p.productId || p.kode || '');
    const name = escapeHtml(p.nama || p.name || 'Produk');
    const image = escapeHtml(p.gambar || p.image || p.imageUrl || '');
    const description = escapeHtml(p.satuan || p.unit || p.deskripsiSingkat || 'Produk kebutuhan harian');
    const price = formatRupiah(p.harga || p.price || 0);
    const oldPrice = p.hargaPromo || p.oldPrice ? formatRupiah(p.hargaNormal || p.oldPrice) : '';
    const stock = Number(p.stok ?? p.stock ?? 0);
    const isOutOfStock = stock <= 0;
    const isLimitedStock = !isOutOfStock && stock <= 10;
    const stockText = isOutOfStock
      ? 'Stok habis'
      : isLimitedStock
        ? `Stok terbatas · tersisa ${stock}`
        : 'Stok tersedia';
    const stockClass = isOutOfStock
      ? 'text-slate-500'
      : isLimitedStock
        ? 'text-amber-700'
        : 'text-brand-700';
    const dotClass = isOutOfStock
      ? 'bg-slate-400'
      : isLimitedStock
        ? 'bg-amber-500'
        : 'bg-brand-500';
    const safeUrl = `/detail-produk.html?id=${encodeURIComponent(productId)}`;

    return `
      <article class="group relative flex min-h-[390px] flex-col overflow-hidden rounded-xl border border-slate-100 bg-white shadow-card transition duration-200 motion-reduce:transition-none hover:shadow-card-hover focus-within:ring-2 focus-within:ring-brand-500 focus-within:ring-offset-2 sm:min-h-[430px]" data-product-card data-product-id="${escapeHtml(productId)}">
        <div class="relative aspect-square shrink-0 overflow-hidden bg-brand-50 p-3 sm:p-4">
          ${p.promo ? '<span class="absolute left-3 top-3 z-10 rounded-md bg-brand-600 px-2 py-1 text-[10px] font-extrabold uppercase tracking-wide text-white">Promo</span>' : ''}
          <img src="${image}" alt="${name}" width="480" height="480" loading="lazy" decoding="async" class="h-full w-full object-contain object-center transition duration-200 motion-reduce:transition-none group-hover:scale-[1.03]" />
        </div>
        <div class="flex flex-1 flex-col p-3 sm:p-4">
          <a href="${safeUrl}" class="rounded-md focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:ring-offset-2" aria-label="Lihat detail ${name}">
            <h2 class="line-clamp-2 min-h-[2.75rem] text-sm font-bold leading-5 text-slate-900 sm:text-base sm:leading-6">${name}</h2>
          </a>
          <p class="mt-1 min-h-5 text-xs text-slate-500 sm:text-sm">${description}</p>
          <div class="mt-3 flex flex-wrap items-baseline gap-x-2 gap-y-1">
            <p class="text-base font-extrabold tracking-tight text-brand-700 sm:text-lg">${price}</p>
            ${oldPrice ? `<p class="text-xs text-slate-400 line-through sm:text-sm">${oldPrice}</p>` : ''}
          </div>
          <p class="mt-3 flex items-center gap-1.5 text-xs font-semibold ${stockClass}" role="status">
            <span class="h-2 w-2 rounded-full ${dotClass}" aria-hidden="true"></span>
            ${stockText}
          </p>
          <div class="mt-auto pt-4" data-product-cart-slot data-product-id="${escapeHtml(productId)}">
            ${isOutOfStock
              ? `<button type="button" disabled class="flex min-h-11 w-full items-center justify-center rounded-lg bg-slate-200 px-3 py-2.5 text-sm font-bold text-slate-500" aria-label="${name} sedang tidak tersedia">Tidak tersedia</button>`
              : renderProductCardCartControl(p)}
          </div>
        </div>
      </article>
    `;
  }

  // Pastikan fungsi ini memakai helper existing aplikasi.
  function formatRupiah(value) {
    return new Intl.NumberFormat('id-ID', {
      style: 'currency',
      currency: 'IDR',
      maximumFractionDigits: 0
    }).format(Number(value) || 0);
  }
</script>
