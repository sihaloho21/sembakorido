plugins = []
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://script.google.com https://script.googleusercontent.com https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; img-src 'self' data: https://ik.imagekit.io https://i.ibb.co.com https://placehold.co https://via.placeholder.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://paket-sembako-online-943127658752.asia-southeast1.run.app https://nominatim.openstreetmap.org; frame-src 'self'; form-action 'self' https://wa.me"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=(), clipboard-read=(self), clipboard-write=(self), fullscreen=(self)"
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

[functions]

  [functions."*"]

[build]
publish = "."

  [build.environment]

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]
