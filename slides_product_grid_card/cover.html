<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redesign Product Grid Card</title>
<style>
*{box-sizing:border-box}
body{margin:0}
.slide-container{width:1280px;min-height:720px;background:#f7fbf8;color:#102a23;font-family:Arial,Helvetica,sans-serif;display:flex;position:relative;overflow:hidden}
.left{width:57%;padding:78px 54px 0 84px;position:relative}
.eyebrow{font-size:15px;letter-spacing:2px;text-transform:uppercase;color:#059669;font-weight:700;margin-bottom:22px}
.title{font-size:58px;line-height:1.04;letter-spacing:-2px;font-weight:800;max-width:610px;margin:0 0 24px}
.subtitle{font-size:24px;line-height:1.35;color:#47645b;max-width:560px;margin-bottom:40px}
.meta{display:flex;gap:12px;align-items:center;color:#6b8179;font-size:15px}
.dot{width:8px;height:8px;border-radius:50%;background:#10b981}
.principle{position:absolute;bottom:64px;left:84px;border-left:4px solid #10b981;padding-left:16px;font-size:16px;color:#47645b;max-width:430px;line-height:1.4}
.right{width:43%;background:#e6f7ee;position:relative;display:flex;align-items:center;justify-content:center}
.orb{position:absolute;width:340px;height:340px;border-radius:50%;background:#c8f0dc;right:30px;top:80px}
.grid{position:relative;z-index:1;width:360px;display:grid;grid-template-columns:1fr 1fr;gap:12px;transform:rotate(-4deg)}
.card{background:#fff;border-radius:22px;min-height:210px;padding:12px;box-shadow:0 18px 42px rgba(22,101,73,.13);position:relative}
.card.large{grid-row:span 2;min-height:430px}
.media{height:106px;border-radius:16px;background:#eaf8f0;display:flex;align-items:center;justify-content:center;color:#41a879;font-weight:800;font-size:34px}
.large .media{height:260px}
.line{height:10px;border-radius:8px;background:#dbece3;margin-top:12px}
.line.short{width:58%}
.price{height:14px;width:72%;border-radius:8px;background:#11a878;margin-top:12px}
.button{height:34px;border-radius:11px;background:#0f9f70;margin-top:14px}
.badge{position:absolute;top:20px;left:20px;background:#d1fae5;color:#047857;border-radius:9px;padding:6px 9px;font-size:10px;font-weight:800}
.footer-mark{position:absolute;right:34px;bottom:24px;color:#75a58f;font-size:12px;letter-spacing:1px;text-transform:uppercase}
</style>
</head>
<body>
<div class="slide-container">
  <section class="left">
    <div class="eyebrow">Paket Sembako · PRD v1.0</div>
    <h1 class="title">Redesign<br>Product Grid Card</h1>
    <p class="subtitle">Structured Product Card untuk pengalaman belanja yang lebih cepat, jelas, dan konsisten.</p>
    <div class="meta"><span class="dot"></span><span>Product &amp; Frontend Team</span><span>•</span><span>Mobile-first</span></div>
    <div class="principle">“Pahami produk, harga, stok, dan aksi—tanpa harus membuka detail.”</div>
  </section>
  <section class="right">
    <div class="orb"></div>
    <div class="grid">
      <div class="card large"><span class="badge">PROMO</span><div class="media">5 kg</div><div class="line"></div><div class="line short"></div><div class="price"></div><div class="button"></div></div>
      <div class="card"><div class="media">1 kg</div><div class="line"></div><div class="line short"></div><div class="price"></div></div>
      <div class="card"><div class="media">PCS</div><div class="line"></div><div class="line short"></div><div class="price"></div></div>
    </div>
    <div class="footer-mark">A system for confident choice</div>
  </section>
</div>
</body>
</html>
