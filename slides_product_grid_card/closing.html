<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .slide-container {
        width: 1280px;
        min-height: 720px;
        background: #102a23;
        color: #ffffff;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
    }
    .orb-bg {
        position: absolute;
        width: 800px;
        height: 800px;
        background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, rgba(16, 42, 35, 0) 70%);
        top: -200px;
        right: -200px;
        z-index: 0;
    }
    .eyebrow {
        color: #10b981;
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 4px;
        text-transform: uppercase;
        margin-bottom: 40px;
        z-index: 1;
    }
    .quote {
        font-size: 54px;
        font-weight: 800;
        text-align: center;
        max-width: 900px;
        line-height: 1.2;
        margin-bottom: 60px;
        z-index: 1;
        letter-spacing: -1px;
    }
    .path-container {
        display: flex;
        align-items: center;
        gap: 20px;
        z-index: 1;
        margin-bottom: 80px;
    }
    .path-step {
        background: rgba(255, 255, 255, 0.1);
        padding: 12px 24px;
        border-radius: 12px;
        font-size: 18px;
        font-weight: 700;
        color: #d1fae5;
        border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .arrow {
        color: #10b981;
        font-weight: 800;
        font-size: 24px;
    }
    .next-steps {
        text-align: center;
        z-index: 1;
    }
    .next-title {
        font-size: 14px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: #6b8179;
        margin-bottom: 16px;
    }
    .next-action {
        font-size: 24px;
        font-weight: 700;
        color: #ffffff;
    }
    .footer-mark {
        position: absolute;
        bottom: 40px;
        font-size: 12px;
        color: #47645b;
        letter-spacing: 1px;
    }
</style>
</head>
<body>
<div class="slide-container">
    <div class="orb-bg"></div>

    <div class="eyebrow">Kesimpulan</div>

    <div class="quote">
        Product card harus terasa sederhana, cepat dipahami, dan langsung digunakan.
    </div>

    <div class="path-container">
        <div class="path-step">Gambar</div>
        <div class="arrow">→</div>
        <div class="path-step">Nama</div>
        <div class="arrow">→</div>
        <div class="path-step">Harga</div>
        <div class="arrow">→</div>
        <div class="path-step">Status</div>
        <div class="arrow">→</div>
        <div class="path-step">Aksi</div>
    </div>

    <div class="next-steps">
        <div class="next-title">Langkah Berikutnya</div>
        <div class="next-action">Implementasi Bertahap &amp; Verifikasi Browser</div>
    </div>

    <div class="footer-mark">Paket Sembako · Redesign Product Grid Card · 2026</div>
</div>
</body>
</html>
